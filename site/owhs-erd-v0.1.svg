<title id="erd-title">OWHS v0.1 entity map</title>
<desc id="erd-desc">Nineteen boxes on a grid: organisation-level entities across the top, the worker pseudonym and its individual-level records in the middle, the shared definitions along the bottom, the aggregate report and benchmark release on the right, and two reserved names. Solid lines are structural references, dotted lines are the aggregation flow into the report, dashed lines mark reserved names.</desc>
