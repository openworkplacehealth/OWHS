name: licence-watch

# Weekly: fetch every licence page the registry cites, build a representation of its visible text, link targets
# and rights metadata, and compare it with the recorded baseline (evidence/licence-hashes.json). Pages the source
# plan declares blocked to automation (they refuse automated requests) are still requested; when they fail again
# with a declared code they are listed as needing a person, never as unchanged, and left out of the run status,
# which counts what automation can check. The one standing issue gets a comment only when a page changed, when a
# page automation can check failed, or, on the first run of a month, a short reminder listing the pages that need
# a person. The watcher never edits a licence class; a person reads the page. Baselines are updated by committing
# evidence/licence-hashes.json through a pull request, never by the workflow.

on:
  schedule:
    - cron: '0 7 * * 1'        # Mondays 07:00 UTC
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: index-consuming-jobs
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: compare licence sources with the recorded baseline
        id: w
        continue-on-error: true
        run: python tools/watch_licences.py --plan evidence/licence-watch-sources-v1.json --captures /tmp/licence-captures --report /tmp/licence-report.json
      # The public artifact is an allowlist: the run report only. The capture directory holds whole
      # fetched pages and is never uploaded by a broad glob.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: licence-source-report
          path: /tmp/licence-report.json
      - name: comment on the one source-monitoring issue when a page changed, a checkable page failed, or the monthly reminder is due
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          REPORT: /tmp/licence-report.json
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          MARKER="<!-- owhs-licence-source-monitor -->"
          if [ -f "$REPORT" ]; then
            WHY=$(python -c "import json, os; print(json.load(open(os.environ['REPORT'])).get('notify') or '')")
            if [ -z "$WHY" ]; then echo "no page changed, no checkable page failed, no reminder due: no comment this week"; exit 0; fi
            python - <<'PY' > /tmp/body.md
          import json, os
          d = json.load(open(os.environ["REPORT"]))
          print("<!-- owhs-licence-source-monitor -->")
          print(d["comment_body"])
          print()
          print(f"Run: {os.environ['RUN_URL']}")
          PY
          else
            printf '%s\nThe licence watcher wrote no report this run, so nothing was checked. The run log says why.\n\nRun: %s\n' "$MARKER" "$RUN_URL" > /tmp/body.md
          fi
          EXISTING=$(gh issue list --label licence --state open --search "$MARKER in:body" --json number --jq '.[0].number // empty')
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --body-file /tmp/body.md
          else
            gh issue create --title "Licence source monitoring" --label licence --body-file /tmp/body.md
          fi
