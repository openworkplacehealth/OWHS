name: validate

# Runs the Level 1 conformance evidence and the registry build check on every push and pull request. The gate is
# --check, which regenerates the report in memory and fails if it differs from the
# committed one, so a stale examples/validation_report.json cannot merge. It also fails
# if any fixture stops matching the verdict its filename claims.
#
# Level 2 and Level 3 are specified and not implemented as conformance checks; no step
# here certifies either. The steps below verify their own documented contracts only: the
# v0.2 schemas match their generator, which writes each inline enum from the code list its
# $comment pins at generation time; code-list versions resolve and archived copies are
# intact; profiles, bundles and the sixteen entity types behave as documented through the
# real validator; the specification matches its sources; the entity-graph checker's own
# suite passes. None of this establishes that a coded value is current in an external
# terminology, that submitted counts are true, or that an output is safe to disclose.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  level-1:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - name: validation report is current and every fixture matches its name
        run: python tools/build_validation_report.py --check
      - name: registry pages are generated from the committed dataset, rubric and generator
        run: python registry/build_registry_site.py --check
      - name: registry page generator keeps a cited URL whole when it contains parentheses
        run: python registry/build_registry_site.py --self-test
      - name: a change to a published surface carries a changelog entry
        if: github.event_name == 'pull_request'
        run: |
          git fetch --no-tags origin ${{ github.base_ref }}
          python tools/check_changelog.py --base origin/${{ github.base_ref }}
      - name: each changelog tab's count equals its number of rows
        run: python tools/check_changelog.py --counts
      - name: changelog rule behaves as documented
        run: python tools/check_changelog.py --self-test
      - name: the changelog page is a fresh render of its entry files
        run: python tools/build_changelog.py --check
      - name: changelog build behaves as documented
        run: python tools/build_changelog.py --self-test
      - name: the worked record on the standard page validates and its shown output is the validator's
        run: python tools/check_site_examples.py
      - name: site-example check behaves as documented
        run: python tools/check_site_examples.py --self-test
      - name: specification page is rendered from its markdown
        run: python tools/build_spec_page.py --check
      - name: the search index is generated from the pages, the registry dataset and the question bank
        run: python tools/build_search_index.py --check
      - name: search-index generator behaves as documented
        run: python tools/build_search_index.py --self-test
      - name: v0.2 schemas match their generator
        run: python tools/build_schemas_v0_2.py --check
      - name: extension mechanism and profile validation behave as documented
        run: python tools/check_profiles.py --self-test
      - name: bundle join checks behave as documented
        run: python tools/check_measurement.py --self-test
      - name: code-list versions resolve, archives are intact, the absence-reason crosswalk is complete
        run: python tools/check_codelist_mappings.py --self-test
      - name: workflow files parse strictly
        run: python tools/check_workflows.py
      - name: cycle definition and verifier contract
        run: python tools/cycle.py --self-test
      - name: licence source watcher behaves as documented
        run: python tools/watch_licences.py --self-test
      - name: harvester pure functions and expected channel set
        run: python tools/harvest.py --self-test
      - name: retraction watcher coverage accounting
        run: python tools/watch_retractions.py --self-test
      - name: retrieval evaluator accounting
        run: python tools/measure_recall.py --self-test
      - name: screening proposal allowlist gate
        run: python tools/check_proposal_allowlist.py --self-test
      - name: document pages are rendered from docs/ and their local links resolve
        run: python tools/build_doc_page.py --check
      - name: the nine remaining entity types (schemas, fixtures and named rules through the real validator)
        run: python tools/check_remaining_entities.py --self-test
      - name: the entity map drawings and the pages they are spliced into match fresh generation
        run: python tools/build_erd.py --check
      - name: the entity map's marker contract refuses reversed, missing and duplicated markers
        run: python tools/build_erd.py --self-test
      - name: the current v0.2 download and the site's schema, example and code-list mirrors are a fresh build of their sources
        run: python tools/build_bundle.py --check
      - name: bundle builder check refuses a stale member, a missing, extra, duplicate or misordered member, a mismatched or orphan mirror file
        run: python tools/build_bundle.py --self-test
      - name: the v0.1 release archive is the published one, byte for byte
        run: python tools/check_v01_archive.py
      - name: the v0.2 specification matches its sources
        run: python tools/build_spec_v0_2.py --check
      - name: specification generator (no invented privacy class, inheritance never widens, opaque-reference controls, exact limit statements)
        run: python tools/build_spec_v0_2.py --self-test
      - name: entity-graph checker (envelope, G01 to G10, retained measurement checks, profiles, strict input) through its own command line
        run: python tools/check_entity_graph.py --self-test
