name: sweep-tripwire

# The guard against silence. On the third of each month, verifies that this month's planned maintenance cycle
# happened, through tools/cycle.py verify (read-only): a successful run of the evidence-harvest workflow whose
# artefact names this cycle as planned, reports status complete over the full inventory with every expected
# channel complete, was built from the current query file, and is named, with its hash and GitHub run id, by
# an issue the workflow itself authored. A partial run, a manual catch-up, an unrelated successful run, a
# hand-written issue or an issue describing a failed run does not satisfy it. If the check fails, one issue is
# opened for the cycle (never a second). A missing sweep is an incomplete maintenance cycle, not a month with
# no new evidence. This runs two days after the harvest; that is the response time.

on:
  schedule:
    - cron: '0 8 3 * *'
  workflow_dispatch:

permissions:
  issues: write
  actions: read
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: verify this month's planned cycle
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          # explicit bash with pipefail: a verifier that says "not verified" must reach the maintenance branch, and a tool error must too
          set -euo pipefail
          CYCLE=$(python tools/cycle.py window --event schedule | sed -n 's/^cycle_id=//p')
          echo "cycle $CYCLE"
          set +e
          python tools/cycle.py verify --cycle "$CYCLE" --repo "$REPO" > /tmp/verify.txt 2>&1
          RC=$?
          set -e
          cat /tmp/verify.txt
          if [ "$RC" -eq 0 ]; then exit 0; fi
          if [ "$RC" -ne 1 ]; then echo "verifier tool error (exit $RC); treated as not verified" | tee -a /tmp/verify.txt; fi
          EXISTING=$(gh issue list --repo "$REPO" --label maintenance --state open --search "\"No verified evidence sweep for $CYCLE\" in:title" --json number --jq 'length')
          if [ "$EXISTING" = "0" ]; then
            gh issue create --repo "$REPO" --title "No verified evidence sweep for $CYCLE" --label maintenance \
              --body "$(printf 'tools/cycle.py verify could not correlate a successful evidence-harvest run, a complete full-inventory artefact for cycle %s built from the current query file, and a workflow-authored issue naming that run and artefact. Treat this cycle as incomplete until they exist. A partial run, a manual catch-up, an unrelated run or a hand-written issue does not count.\n\nVerifier exit %s. Output:\n```\n%s\n```' "$CYCLE" "$RC" "$(cat /tmp/verify.txt)")"
          fi
          exit 1
