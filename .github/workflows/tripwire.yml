name: sweep-tripwire

# The guard against silence. On the third of each month, checks that an issue labelled evidence-sweep was
# opened this month (the harvest workflow opens one on the first). If none exists, opens an issue saying so.
# A missing sweep is an incomplete maintenance cycle, not a month with no new evidence.

on:
  schedule:
    - cron: '0 8 3 * *'
  workflow_dispatch:

permissions:
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: look for this month's sweep
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          SINCE=$(date -u +%Y-%m-01T00:00:00Z)
          N=$(gh issue list --repo "$REPO" --label evidence-sweep --state all --search "created:>=$SINCE" --json number --jq 'length')
          echo "evidence-sweep issues this month: $N"
          if [ "$N" = "0" ]; then
            gh issue create --repo "$REPO" --title "No evidence sweep recorded for $(date -u +%Y-%m)" --label maintenance \
              --body "The tripwire found no issue labelled evidence-sweep created since $SINCE. The monthly harvest did not run or did not report. Treat this month as an incomplete maintenance cycle until a sweep is recorded."
            exit 1
          fi
