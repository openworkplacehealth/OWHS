name: sweep-tripwire

# The guard against silence. On the third of each month, checks two things: that the evidence-harvest workflow
# ran this month and concluded successfully, and that it opened its issue labelled evidence-sweep (authored by
# the Actions bot, so a hand-labelled issue does not satisfy the check). If either is missing, opens one issue
# saying so. A missing sweep is an incomplete maintenance cycle, not a month with no new evidence.

on:
  schedule:
    - cron: '0 8 3 * *'
  workflow_dispatch:

permissions:
  issues: write
  actions: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: look for this month's sweep
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          SINCE=$(date -u +%Y-%m-01T00:00:00Z)
          RUNS=$(gh run list --repo "$REPO" --workflow evidence-harvest --created ">=$SINCE" --json conclusion --jq '[.[] | select(.conclusion=="success")] | length')
          N=$(gh issue list --repo "$REPO" --label evidence-sweep --author app/github-actions --state all --search "created:>=$SINCE" --json number --jq 'length')
          echo "successful evidence-harvest runs this month: $RUNS; bot-authored evidence-sweep issues: $N"
          if [ "$RUNS" = "0" ] || [ "$N" = "0" ]; then
            EXISTING=$(gh issue list --repo "$REPO" --label maintenance --state open --search "\"No evidence sweep recorded for $(date -u +%Y-%m)\"" --json number --jq 'length')
            if [ "$EXISTING" = "0" ]; then
              gh issue create --repo "$REPO" --title "No evidence sweep recorded for $(date -u +%Y-%m)" --label maintenance \
                --body "The tripwire found $RUNS successful evidence-harvest runs and $N harvest issues created by the workflow since $SINCE. The monthly harvest did not run to completion or did not report. Treat this month as an incomplete maintenance cycle until a run and its issue exist."
            fi
            exit 1
          fi
